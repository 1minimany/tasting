<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINI & MANY — Tasting Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#FAF5EE;font-family:'Cormorant Garamond',serif;color:#5a463c;display:flex;justify-content:center}
.c{max-width:460px;margin:24px;padding:36px 28px;border:1px solid #B89460;outline:3px solid #B8946055;outline-offset:6px;text-align:center}
img{width:220px}h1{color:#9E6E55;font-weight:400;font-size:2.2em;margin:.3em 0}.d{color:#9E6E55;font-size:1.35em}
input,select{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #B89460;background:#fff;font:inherit;font-size:1.1em}
button{width:100%;padding:14px;background:#9E6E55;color:#fff;border:0;font:inherit;font-size:1.2em;letter-spacing:2px;margin-top:10px}</style></head>
<body><div class="c"><img src="logo-cropped.png" alt="MINI & MANY"><h1>Tasting Invitation</h1>
<p>You are invited to join us for a tasting experience</p><p class="d">Wednesday, 04 November 2026</p><p>The Avenues Mall Branch – End of Phase One</p>
<form id="f"><input name="name" placeholder="Full name" required><input name="phone" type="tel" placeholder="Phone number" required>
<select name="time" required><option value="">Select your time</option>
<option>12:00 PM</option><option>1:00 PM</option><option>2:00 PM</option><option>3:00 PM</option><option>4:00 PM</option><option>5:00 PM</option><option>6:00 PM</option><option>7:00 PM</option><option>8:00 PM</option><option>9:00 PM</option></select>
<button>CONFIRM</button></form><p id="ok" style="display:none;font-size:1.3em;color:#9E6E55">Thank you — your appointment is confirmed.</p></div>
<script>
// Fill in after creating the Google Form: FORM_ID and the entry.<id> of each question
const FORM="https://docs.google.com/forms/d/e/1FAIpQLSdNfEJ6AVzykcEy9FSrusBwYyu1ZJEwEPkatkqLk7IGBF8oMw/formResponse",E={name:"entry.1655047137",phone:"entry.1937265659",time:"entry.91117268"};
f.onsubmit=e=>{e.preventDefault();const d=new FormData(f),b=new URLSearchParams();for(const k in E)b.append(E[k],d.get(k));
fetch(FORM,{method:"POST",mode:"no-cors",body:b}).finally(()=>{f.style.display="none";ok.style.display="block"})};
</script></body></html>
